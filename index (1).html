<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASH VISION | Deep Biometric Intelligence</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%236366f1%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M3 7V5a2 2 0 0 1 2-2h2%22/><path d=%22M17 3h2a2 2 0 0 1 2 2v2%22/><path d=%22M21 17v2a2 2 0 0 1-2 2h-2%22/><path d=%22M7 21H5a2 2 0 0 1-2-2v-2%22/><circle cx=%2212%22 cy=%2212%22 r=%223%22/><path d=%22M7 12c.18 0 .35 0 .53.03a8 8 0 0 1 8.94 0c.18-.03.35-.03.53-.03%22/></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

        @keyframes scan-vertical { 0% { top: 0%; } 100% { top: 100%; } }
        @keyframes scan-horizontal { 0% { left: 0%; } 50% { left: 100%; } 100% { left: 0%; } }
        @keyframes pulse-glow { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.6; } }
        @keyframes slide-up { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slide-in-bottom { from { opacity: 0; transform: translateY(100%); } to { opacity: 1; transform: translateY(0); } }
        
        body { 
            background-color: #030303; 
            color: #ffffff; 
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-panel { 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.07); 
            transition: border-color 0.3s ease, background 0.3s ease;
            will-change: border-color;
        }

        .glass-panel:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .interactive-card {
            transition: transform 0.2s ease;
            will-change: transform;
        }
        
        @media (hover: hover) {
            .interactive-card:hover {
                transform: translateY(-4px) translateZ(0);
            }
        }

        .text-neon {
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 50%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .laser-scan-vertical {
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #6366f1, transparent);
            box-shadow: 0 0 15px #6366f1;
            animation: scan-vertical 2s linear infinite;
            z-index: 10;
            will-change: top;
        }
        
        .laser-scan-horizontal {
            position: absolute;
            top: 0;
            width: 2px;
            height: 100%;
            background: linear-gradient(180deg, transparent, #6366f1, transparent);
            box-shadow: 0 0 15px #6366f1;
            animation: scan-horizontal 2.5s ease-in-out infinite;
            animation-delay: 0.3s;
            z-index: 10;
            will-change: left;
        }
        
        .scan-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(99, 102, 241, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.08) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.5;
            z-index: 5;
        }
        
        .corner-marker {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid #6366f1;
            opacity: 0.5;
        }
        
        .corner-tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .corner-tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .corner-br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        .metric-progress-bar {
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }

        .metric-progress-fill {
            height: 100%;
            background: #6366f1;
            box-shadow: 0 0 10px #6366f1;
            transition: width 1.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .h-section {
            font-weight: 700;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .tooltip {
            position: absolute;
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .tooltip.show {
            opacity: 1;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #a5b4fc);
            transition: width 0.3s ease;
            box-shadow: 0 0 10px #6366f1;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback } = React;

        const LucideIcon = ({ name, size = 18, className = "" }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (window.lucide && ref.current) {
                    window.lucide.createIcons({
                        root: ref.current,
                        nameAttr: 'data-lucide',
                        attrs: { width: size, height: size, class: className }
                    });
                }
            }, [name, size, className]);
            return <span ref={ref} dangerouslySetInnerHTML={{ __html: `<i data-lucide="${name}"></i>` }} style={{ display: 'inline-flex' }} />;
        };

        // Tooltip Component
        const Tooltip = ({ content, children }) => {
            const [show, setShow] = useState(false);
            const [position, setPosition] = useState({ x: 0, y: 0 });
            const ref = useRef(null);

            const handleMouseEnter = (e) => {
                const rect = e.target.getBoundingClientRect();
                setPosition({ x: rect.left + rect.width / 2, y: rect.top - 10 });
                setShow(true);
            };

            return (
                <div 
                    ref={ref}
                    onMouseEnter={handleMouseEnter}
                    onMouseLeave={() => setShow(false)}
                    className="relative inline-block"
                >
                    {children}
                    {show && (
                        <div 
                            className="fixed z-50 px-4 py-2 text-xs bg-black/90 border border-indigo-500/30 rounded-lg -translate-x-1/2 -translate-y-full whitespace-nowrap"
                            style={{ left: position.x, top: position.y }}
                        >
                            {content}
                        </div>
                    )}
                </div>
            );
        };

        // Modal Component
        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div 
                        className="glass-panel rounded-[2rem] max-w-2xl w-full max-h-[90vh] overflow-auto p-8"
                        onClick={(e) => e.stopPropagation()}
                    >
                        <div className="flex items-center justify-between mb-6">
                            <h2 className="text-2xl font-bold text-neon">{title}</h2>
                            <button 
                                onClick={onClose}
                                className="w-10 h-10 rounded-xl bg-white/5 hover:bg-white/10 flex items-center justify-center transition-colors"
                            >
                                <LucideIcon name="x" size={20} />
                            </button>
                        </div>
                        {children}
                    </div>
                </div>
            );
        };

        // Onboarding Modal
        const OnboardingModal = ({ isOpen, onClose }) => (
            <Modal isOpen={isOpen} onClose={onClose} title="Welcome to ASH VISION">
                <div className="space-y-6">
                    <div className="glass-panel p-6 rounded-2xl">
                        <h3 className="text-lg font-semibold text-indigo-400 mb-4 flex items-center gap-2">
                            <LucideIcon name="check-circle" size={20} />
                            Best Practices for Accurate Results
                        </h3>
                        <div className="space-y-3 text-sm text-white/70">
                            <div className="flex items-start gap-3">
                                <div className="w-6 h-6 rounded-full bg-green-500/20 flex items-center justify-center shrink-0 mt-0.5">
                                    <LucideIcon name="check" size={14} className="text-green-400" />
                                </div>
                                <p><strong>Front-facing photo</strong> - Look directly at the camera</p>
                            </div>
                            <div className="flex items-start gap-3">
                                <div className="w-6 h-6 rounded-full bg-green-500/20 flex items-center justify-center shrink-0 mt-0.5">
                                    <LucideIcon name="check" size={14} className="text-green-400" />
                                </div>
                                <p><strong>Neutral expression</strong> - Relaxed face, no smiling</p>
                            </div>
                            <div className="flex items-start gap-3">
                                <div className="w-6 h-6 rounded-full bg-green-500/20 flex items-center justify-center shrink-0 mt-0.5">
                                    <LucideIcon name="check" size={14} className="text-green-400" />
                                </div>
                                <p><strong>Good lighting</strong> - Even, natural lighting preferred</p>
                            </div>
                            <div className="flex items-start gap-3">
                                <div className="w-6 h-6 rounded-full bg-green-500/20 flex items-center justify-center shrink-0 mt-0.5">
                                    <LucideIcon name="check" size={14} className="text-green-400" />
                                </div>
                                <p><strong>Clear image</strong> - No blur, good resolution</p>
                            </div>
                        </div>
                    </div>

                    <div className="glass-panel p-6 rounded-2xl border-red-500/20">
                        <h3 className="text-lg font-semibold text-red-400 mb-4 flex items-center gap-2">
                            <LucideIcon name="x-circle" size={20} />
                            Avoid These
                        </h3>
                        <div className="space-y-3 text-sm text-white/70">
                            <div className="flex items-start gap-3">
                                <div className="w-6 h-6 rounded-full bg-red-500/20 flex items-center justify-center shrink-0 mt-0.5">
                                    <LucideIcon name="x" size={14} className="text-red-400" />
                                </div>
                                <p>Side angles or tilted head</p>
                            </div>
                            <div className="flex items-start gap-3">
                                <div className="w-6 h-6 rounded-full bg-red-500/20 flex items-center justify-center shrink-0 mt-0.5">
                                    <LucideIcon name="x" size={14} className="text-red-400" />
                                </div>
                                <p>Sunglasses or accessories covering face</p>
                            </div>
                            <div className="flex items-start gap-3">
                                <div className="w-6 h-6 rounded-full bg-red-500/20 flex items-center justify-center shrink-0 mt-0.5">
                                    <LucideIcon name="x" size={14} className="text-red-400" />
                                </div>
                                <p>Dark or uneven lighting</p>
                            </div>
                            <div className="flex items-start gap-3">
                                <div className="w-6 h-6 rounded-full bg-red-500/20 flex items-center justify-center shrink-0 mt-0.5">
                                    <LucideIcon name="x" size={14} className="text-red-400" />
                                </div>
                                <p>Blurry or low-quality images</p>
                            </div>
                        </div>
                    </div>

                    <button
                        onClick={onClose}
                        className="w-full py-4 bg-indigo-600 hover:bg-indigo-500 rounded-2xl font-bold tracking-wider uppercase transition-colors"
                    >
                        Got It - Start Analyzing
                    </button>
                </div>
            </Modal>
        );

        // History Modal
        const HistoryModal = ({ isOpen, onClose, history, onSelect, onClear }) => (
            <Modal isOpen={isOpen} onClose={onClose} title="Analysis History">
                <div className="space-y-4">
                    {history.length === 0 ? (
                        <div className="text-center py-12 text-white/30">
                            <LucideIcon name="clock" size={48} className="mx-auto mb-4" />
                            <p>No previous analyses</p>
                        </div>
                    ) : (
                        <>
                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">
                                {history.map((item, idx) => (
                                    <div 
                                        key={idx}
                                        onClick={() => { onSelect(item); onClose(); }}
                                        className="glass-panel p-4 rounded-xl cursor-pointer hover:border-indigo-500/50 transition-all"
                                    >
                                        <img src={item.image} className="w-full aspect-square object-cover rounded-lg mb-3" alt="" />
                                        <div className="text-xs text-white/50">{new Date(item.date).toLocaleDateString()}</div>
                                        <div className="text-lg font-bold text-neon">{item.results.score}/10</div>
                                    </div>
                                ))}
                            </div>
                            <button
                                onClick={() => { onClear(); onClose(); }}
                                className="w-full py-3 bg-red-500/20 hover:bg-red-500/30 rounded-xl text-red-400 font-semibold transition-colors"
                            >
                                Clear All History
                            </button>
                        </>
                    )}
                </div>
            </Modal>
        );

        // Comparison Modal
        const ComparisonModal = ({ isOpen, onClose, image1, results1, image2, results2 }) => (
            <Modal isOpen={isOpen} onClose={onClose} title="Side-by-Side Comparison">
                <div className="grid grid-cols-2 gap-6">
                    <div className="space-y-4">
                        <img src={image1} className="w-full aspect-square object-cover rounded-xl" alt="Photo 1" />
                        <div className="glass-panel p-4 rounded-xl">
                            <div className="text-5xl font-thin text-neon mb-2">{results1.score}/10</div>
                            <div className="text-sm text-white/50">{results1.faceShape}</div>
                        </div>
                    </div>
                    <div className="space-y-4">
                        <img src={image2} className="w-full aspect-square object-cover rounded-xl" alt="Photo 2" />
                        <div className="glass-panel p-4 rounded-xl">
                            <div className="text-5xl font-thin text-neon mb-2">{results2.score}/10</div>
                            <div className="text-sm text-white/50">{results2.faceShape}</div>
                        </div>
                    </div>
                </div>
            </Modal>
        );

        const MetricSection = React.memo(({ metrics }) => {
            const [expanded, setExpanded] = useState(null);

            return (
                <div className="glass-panel rounded-[2rem] sm:rounded-[3rem] overflow-hidden animate-[slide-up_0.8s_ease_forwards]">
                    <div className="px-6 sm:px-10 py-8 border-b border-white/5 flex items-center justify-between">
                        <div className="flex items-center gap-4">
                            <LucideIcon name="activity" size={20} className="text-indigo-400" />
                            <h2 className="h-section">Deep Geometry Metrics</h2>
                        </div>
                        <LucideIcon name="fingerprint" size={18} className="text-white/20" />
                    </div>
                    <div className="p-6 sm:p-10 space-y-6">
                        {metrics.map((m) => (
                            <div key={m.id} className="p-8 rounded-[2.5rem] bg-white/[0.02] border border-white/5 hover:border-indigo-500/20 transition-all group">
                                <div className="flex items-center justify-between mb-6">
                                    <div className="flex items-center gap-3">
                                        <Tooltip content={m.insight}>
                                            <div className="w-12 h-12 rounded-xl bg-indigo-500/10 flex items-center justify-center border border-indigo-500/10 group-hover:scale-110 transition-transform cursor-help">
                                                <LucideIcon name={m.icon} size={18} className="text-indigo-400" />
                                            </div>
                                        </Tooltip>
                                        <div>
                                            <h3 className="text-lg font-medium tracking-tight uppercase text-white/90">{m.label}</h3>
                                            <p className="text-xs text-white/30 mt-1">{m.insight}</p>
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        <div className="text-4xl font-thin tracking-tighter text-neon">{m.value}</div>
                                        <div className="text-[8px] text-white/20 tracking-widest mt-1 font-black">PRECISION INDEX</div>
                                    </div>
                                </div>
                                <div className="metric-progress-bar">
                                    <div className="metric-progress-fill" style={{ width: `${m.value}%` }} />
                                </div>
                                {expanded === m.id ? (
                                    <div className="mt-8 pt-8 border-t border-white/5 space-y-6 animate-[slide-up_0.4s_ease_forwards]">
                                        <div>
                                            <h4 className="text-xs text-indigo-400 uppercase tracking-[0.3em] font-black mb-3">Analysis</h4>
                                            <p className="text-sm text-white/50 leading-relaxed">{m.deepDive.explanation}</p>
                                        </div>
                                        <div>
                                            <h4 className="text-xs text-indigo-400 uppercase tracking-[0.3em] font-black mb-3">Enhancement Protocol</h4>
                                            <div className="flex flex-wrap gap-2">
                                                {m.deepDive.tips.map((tip, i) => (
                                                    <div key={i} className="px-3 py-2 rounded-lg bg-white/[0.03] border border-white/5">
                                                        <span className="text-xs text-white/40">{tip}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                        <button onClick={() => setExpanded(null)} className="text-xs text-indigo-400 uppercase tracking-widest font-black hover:text-indigo-300 transition-colors flex items-center gap-2">
                                            <LucideIcon name="x" size={12} /> Collapse
                                        </button>
                                    </div>
                                ) : (
                                    <button onClick={() => setExpanded(m.id)} className="mt-6 text-xs text-indigo-400/50 uppercase tracking-widest font-black hover:text-indigo-400 transition-colors flex items-center gap-2">
                                        <LucideIcon name="chevron-down" size={12} /> Deep Dive
                                    </button>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        });

        // Model caching
        let modelsLoaded = false;

        // Enhanced Analysis Function with caching
        const analyzeAesthetics = async (imageSrc, onProgress) => {
            try {
                // Load models only once
                if (!modelsLoaded) {
                    onProgress?.({ status: 'Loading AI Models...', progress: 10 });
                    const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
                    
                    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                    onProgress?.({ status: 'Loading Face Landmarks...', progress: 30 });
                    await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                    onProgress?.({ status: 'Loading Expression Analysis...', progress: 50 });
                    await faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL);
                    modelsLoaded = true;
                } else {
                    onProgress?.({ status: 'Models Ready...', progress: 50 });
                }

                onProgress?.({ status: 'Detecting Face...', progress: 70 });
                const img = await faceapi.fetchImage(imageSrc);
                
                // Optimized image quality check
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                const maxSize = 800;
                const scale = Math.min(maxSize / img.width, maxSize / img.height, 1);
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                const brightness = calculateBrightness(imageData);
                
                const qualityIssues = [];
                if (brightness < 50) qualityIssues.push("Image too dark");
                if (brightness > 230) qualityIssues.push("Image overexposed");

                onProgress?.({ status: 'Analyzing Facial Features...', progress: 85 });
                const detection = await faceapi
                    .detectSingleFace(img, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceExpressions();

                if (!detection) {
                    throw new Error("No face detected. Please use a front-facing photo with good lighting.");
                }

                const landmarks = detection.landmarks;
                const positions = landmarks.positions;

                // Optimized skin and hair analysis
                const { skinTone, hairType } = analyzeColorFeatures(imageData, landmarks, canvas.width, canvas.height);

                onProgress?.({ status: 'Computing Measurements...', progress: 95 });

                // 1. Bilateral Symmetry
                const leftEyeCenter = getCenter(landmarks.getLeftEye());
                const rightEyeCenter = getCenter(landmarks.getRightEye());
                const noseTip = landmarks.getNose()[3];
                const faceCenterX = (leftEyeCenter.x + rightEyeCenter.x) / 2;
                const asymmetry = Math.abs(noseTip.x - faceCenterX) / Math.abs(rightEyeCenter.x - leftEyeCenter.x);
                const symmetry = Math.round(Math.max(75, 100 - (asymmetry * 200)));

                // 2. Proportional Harmony (Golden Ratio)
                const jawLine = landmarks.getJawOutline();
                const faceHeight = Math.abs(jawLine[8].y - positions[24].y);
                const faceWidth = Math.abs(jawLine[0].x - jawLine[16].x);
                const goldenRatio = 1.618;
                const actualRatio = faceHeight / faceWidth;
                const goldenRatioMatch = Math.round(Math.max(75, 100 - Math.abs(actualRatio - goldenRatio) * 50));

                // 3. Facial Thirds (upper, middle, lower face proportions)
                const hairline = positions[24].y;
                const eyebrowBottom = positions[19].y;
                const noseTipY = noseTip.y;
                const chinBottom = jawLine[8].y;
                
                const upperThird = eyebrowBottom - hairline;
                const middleThird = noseTipY - eyebrowBottom;
                const lowerThird = chinBottom - noseTipY;
                const totalHeight = chinBottom - hairline;
                
                const idealThird = totalHeight / 3;
                const thirdsDeviation = (Math.abs(upperThird - idealThird) + Math.abs(middleThird - idealThird) + Math.abs(lowerThird - idealThird)) / totalHeight;
                const facialThirds = Math.round(Math.max(70, 100 - (thirdsDeviation * 100)));

                // 4. Jawline Definition (gonial angle)
                const jaw1 = jawLine[5];
                const jaw2 = jawLine[8];
                const jaw3 = jawLine[11];
                const angle1 = Math.atan2(jaw2.y - jaw1.y, jaw2.x - jaw1.x);
                const angle2 = Math.atan2(jaw3.y - jaw2.y, jaw3.x - jaw2.x);
                const gonialAngle = Math.abs(angle2 - angle1) * (180 / Math.PI);
                const jawlineDefinition = Math.round(Math.min(95, Math.max(70, 100 - Math.abs(gonialAngle - 120) / 2)));

                // 5. Cheekbone Prominence
                const cheekboneWidth = Math.abs(positions[0].x - positions[16].x);
                const jawWidth = Math.abs(jawLine[4].x - jawLine[12].x);
                const cheekboneProminence = Math.round(Math.min(95, (cheekboneWidth / jawWidth) * 100));

                // 6. FWHR (Facial Width-to-Height Ratio)
                const fwhr = faceWidth / faceHeight;
                const idealFWHR = 1.9; // Typical ideal
                const fwhrScore = Math.round(Math.max(70, 100 - Math.abs(fwhr - idealFWHR) * 50));

                // 7. Eye Spacing Ratio
                const leftEyeWidth = Math.abs(landmarks.getLeftEye()[0].x - landmarks.getLeftEye()[3].x);
                const rightEyeWidth = Math.abs(landmarks.getRightEye()[0].x - landmarks.getRightEye()[3].x);
                const avgEyeWidth = (leftEyeWidth + rightEyeWidth) / 2;
                const eyeDistance = Math.abs(rightEyeCenter.x - leftEyeCenter.x);
                const eyeSpacingRatio = eyeDistance / avgEyeWidth;
                const eyeSpacing = Math.round(Math.min(95, Math.max(75, 100 - Math.abs(eyeSpacingRatio - 3.5) * 10)));

                // 8. Nose Proportion
                const noseWidth = Math.abs(landmarks.getNose()[0].x - landmarks.getNose()[4].x);
                const noseProportion = noseWidth / faceWidth;
                const noseScore = Math.round(Math.min(95, Math.max(70, 100 - Math.abs(noseProportion - 0.25) * 200)));

                // Overall score
                const score = ((symmetry * 0.2 + goldenRatioMatch * 0.2 + facialThirds * 0.15 + 
                               jawlineDefinition * 0.15 + cheekboneProminence * 0.1 + 
                               fwhrScore * 0.1 + eyeSpacing * 0.05 + noseScore * 0.05) / 10).toFixed(1);

                // Determine face shape
                const jawWidth2 = Math.abs(jawLine[4].x - jawLine[12].x);
                const foreheadWidth = Math.abs(positions[17].x - positions[26].x);
                
                let faceShape;
                if (faceHeight / faceWidth > 1.5) {
                    faceShape = "Oval-Angular";
                } else if (jawWidth2 > cheekboneWidth * 0.95) {
                    faceShape = "Square-Defined";
                } else if (foreheadWidth > cheekboneWidth && jawWidth2 < cheekboneWidth * 0.8) {
                    faceShape = "Heart-Balanced";
                } else {
                    faceShape = "Diamond-Structured";
                }

                // Eye analysis
                let eyeSize, eyeShape;
                if (avgEyeWidth > eyeDistance * 0.35) {
                    eyeSize = "Large";
                    eyeShape = "Almond";
                } else if (avgEyeWidth < eyeDistance * 0.25) {
                    eyeSize = "Narrow";
                    eyeShape = "Hunter";
                } else {
                    eyeSize = "Wide-Set";
                    eyeShape = "Round";
                }
                const eyeShapeFull = `${eyeSize} ${eyeShape} Eyes`;

                // Lip analysis
                const upperLip = landmarks.getMouth().slice(12, 15);
                const lowerLip = landmarks.getMouth().slice(15, 18);
                const lipHeight = Math.abs(upperLip[1].y - lowerLip[1].y);
                const mouthWidth = Math.abs(landmarks.getMouth()[0].x - landmarks.getMouth()[6].x);
                
                let lipVol, lipShape;
                if (lipHeight > mouthWidth * 0.15) {
                    lipVol = "Full";
                    lipShape = "Plump";
                } else if (lipHeight < mouthWidth * 0.08) {
                    lipVol = "Thin";
                    lipShape = "Refined";
                } else {
                    lipVol = "Defined";
                    lipShape = "Symmetrical";
                }
                const lipShapeFull = `${lipVol} ${lipShape} Lips`;

                // Canthal tilt
                const leftEyeOuter = landmarks.getLeftEye()[0];
                const leftEyeInner = landmarks.getLeftEye()[3];
                const rightEyeOuter = landmarks.getRightEye()[3];
                const rightEyeInner = landmarks.getRightEye()[0];
                
                const leftTilt = (leftEyeOuter.y - leftEyeInner.y) / Math.abs(leftEyeOuter.x - leftEyeInner.x);
                const rightTilt = (rightEyeInner.y - rightEyeOuter.y) / Math.abs(rightEyeInner.x - rightEyeOuter.x);
                const avgTilt = (leftTilt + rightTilt) / 2;
                
                let canthalTilt;
                if (avgTilt > 0.05) {
                    canthalTilt = "Positive Canthal Tilt";
                } else if (avgTilt < -0.05) {
                    canthalTilt = "Negative Canthal Tilt";
                } else {
                    canthalTilt = "Neutral Canthal Tilt";
                }

                const adviceMap = {
                    "Oval-Angular": {
                        hair: { icon: 'scissors', title: "Tapered Quiff", points: ["Volume on top", "Short sides", "Matte finish"] },
                        eyewear: { icon: 'glasses', title: "Geometric Frames", points: ["Dark tortoise", "Thin wire", "Rectangular"] },
                        grooming: { icon: 'user-check', title: "Short Boxed Beard", points: ["Sharp lines", "Neck taper", "Conditioned"] }
                    },
                    "Diamond-Structured": {
                        hair: { icon: 'scissors', title: "Textured Fringe", points: ["Messy layers", "Forward flow", "Sea salt spray"] },
                        eyewear: { icon: 'glasses', title: "Browline Frames", points: ["Top heavy", "Clear lower rim", "Standard bridge"] },
                        grooming: { icon: 'user-check', title: "Heavy Stubble", points: ["3-5mm length", "Even trim", "Moisturized"] }
                    },
                    "Square-Defined": {
                        hair: { icon: 'scissors', title: "Classic Side Part", points: ["Natural shine", "Low fade", "Finger styled"] },
                        eyewear: { icon: 'glasses', title: "Rounded Frames", points: ["Circular", "Minimalist", "Warm tones"] },
                        grooming: { icon: 'user-check', title: "Clean Shaven", points: ["Regular exfoliation", "Daily SPF", "Precision razor"] }
                    },
                    "Heart-Balanced": {
                        hair: { icon: 'scissors', title: "Mid-Length Flow", points: ["Avoid volume", "Tuck behind ears", "Argan oil"] },
                        eyewear: { icon: 'glasses', title: "Wayfarer Style", points: ["Gradient lens", "Thick lower", "Keyhole bridge"] },
                        grooming: { icon: 'user-check', title: "Rounded Beard", points: ["Fill narrow chin", "Soft blend", "Conditioning balm"] }
                    }
                };

                const getHairIcon = (type) => {
                    if (type.includes("Curly")) return { name: "wind", color: "text-amber-400" };
                    if (type.includes("Coily")) return { name: "cloud", color: "text-orange-400" };
                    if (type.includes("Wavy")) return { name: "waves", color: "text-blue-400" };
                    return { name: "minus", color: "text-slate-400" };
                };

                const getEyeIcon = (val) => {
                    if (val.includes("Large") || val.includes("Wide")) return { name: "eye", color: "text-cyan-400" };
                    if (val.includes("Deep") || val.includes("Narrow")) return { name: "view", color: "text-blue-500" };
                    return { name: "scan", color: "text-indigo-400" };
                };

                const getLipIcon = (val) => {
                    if (val.includes("Full") || val.includes("Plump")) return { name: "smile", color: "text-rose-400" };
                    if (val.includes("Thin")) return { name: "minus-circle", color: "text-pink-300" };
                    return { name: "megaphone", color: "text-rose-500" };
                };

                const hairMeta = getHairIcon(hairType);
                const eyeMeta = getEyeIcon(eyeShapeFull);
                const lipMeta = getLipIcon(lipShapeFull);

                const confidence = Math.min(95, Math.round((symmetry + goldenRatioMatch) / 2));

                return {
                    score,
                    faceShape,
                    skinTone,
                    hairType,
                    confidence,
                    qualityIssues,
                    features: [
                        { key: "Ocular Phenotype", val: eyeShapeFull, sectionIcon: "eye", resultIcon: eyeMeta.name, color: eyeMeta.color },
                        { key: "Labial Structure", val: lipShapeFull, sectionIcon: "smile", resultIcon: lipMeta.name, color: lipMeta.color },
                        { key: "Orbital Vector", val: canthalTilt, sectionIcon: "trending-up", resultIcon: "arrow-up-right", color: "text-emerald-400" },
                        { key: "Follicular Type", val: hairType, sectionIcon: hairMeta.name, resultIcon: hairMeta.name, color: hairMeta.color }
                    ],
                    advice: adviceMap[faceShape] || adviceMap["Oval-Angular"],
                    metrics: [
                        {
                            id: 'sym', label: 'Bilateral Symmetry', value: symmetry, icon: 'layers',
                            insight: "Left-right facial balance measurement",
                            deepDive: { 
                                explanation: "Measures developmental stability and genetic health markers based on bilateral alignment. Higher symmetry correlates with perceived attractiveness.", 
                                tips: ["Supine sleeping posture", "Unilateral chewing correction", "Facial massage therapy"] 
                            }
                        },
                        {
                            id: 'gr', label: 'Proportional Harmony', value: goldenRatioMatch, icon: 'maximize',
                            insight: "Classical Phi-based alignment (1.618 ratio)",
                            deepDive: { 
                                explanation: "Geometric relationship between horizontal and vertical landmarks matching aesthetic norms based on the golden ratio.", 
                                tips: ["Brow arch calibration", "Lower third volume management", "Facial exercises"] 
                            }
                        },
                        {
                            id: 'thirds', label: 'Facial Thirds', value: facialThirds, icon: 'layout',
                            insight: "Upper, middle, lower face proportions",
                            deepDive: { 
                                explanation: "Ideal face divides into three equal thirds: hairline to eyebrows, eyebrows to nose tip, nose tip to chin.", 
                                tips: ["Hairstyle adjustment", "Facial hair strategy", "Eyebrow shaping"] 
                            }
                        },
                        {
                            id: 'jaw', label: 'Jawline Definition', value: jawlineDefinition, icon: 'square',
                            insight: "Mandibular angle and definition",
                            deepDive: { 
                                explanation: "Measures the gonial angle and overall jaw structure. Ideal angle is around 120 degrees for a defined yet natural look.", 
                                tips: ["Neck exercises", "Reduce body fat", "Mewing technique", "Posture correction"] 
                            }
                        },
                        {
                            id: 'cheek', label: 'Cheekbone Prominence', value: cheekboneProminence, icon: 'octagon',
                            insight: "Zygomatic arch projection",
                            deepDive: { 
                                explanation: "High, prominent cheekbones create facial dimension and are a key attractiveness marker in many cultures.", 
                                tips: ["Facial contouring", "Reduce facial bloating", "Salt reduction"] 
                            }
                        },
                        {
                            id: 'fwhr', label: 'Width-Height Ratio', value: fwhrScore, icon: 'frame',
                            insight: "Facial dimensions balance",
                            deepDive: { 
                                explanation: "Ratio of face width to height. Moderate FWHR (around 1.8-2.0) is associated with perceived strength and attractiveness.", 
                                tips: ["Hairstyle width control", "Facial hair shaping", "Grooming techniques"] 
                            }
                        },
                        {
                            id: 'eyes', label: 'Eye Spacing', value: eyeSpacing, icon: 'scan',
                            insight: "Interpupillary distance ratio",
                            deepDive: { 
                                explanation: "Ideal eye spacing is approximately 3.5x the width of one eye. Proper spacing contributes to facial harmony.", 
                                tips: ["Eyebrow shaping", "Eye makeup techniques", "Glasses selection"] 
                            }
                        },
                        {
                            id: 'nose', label: 'Nasal Proportion', value: noseScore, icon: 'wind',
                            insight: "Nose width relative to face",
                            deepDive: { 
                                explanation: "Ideal nose width is about 25% of face width. Proper proportions create facial balance and harmony.", 
                                tips: ["Contouring techniques", "Breathing exercises", "Facial balance awareness"] 
                            }
                        }
                    ]
                };

            } catch (error) {
                console.error("Analysis error:", error);
                throw error;
            }
        };

        // Optimized helper functions
        const getCenter = (points) => {
            const sum = points.reduce((acc, p) => ({ x: acc.x + p.x, y: acc.y + p.y }), { x: 0, y: 0 });
            return { x: sum.x / points.length, y: sum.y / points.length };
        };

        const calculateBrightness = (imageData) => {
            let total = 0;
            const step = 40; // Sample every 40 pixels for performance
            for (let i = 0; i < imageData.data.length; i += step * 4) {
                const avg = (imageData.data[i] + imageData.data[i + 1] + imageData.data[i + 2]) / 3;
                total += avg;
            }
            return total / (imageData.data.length / (step * 4));
        };

        const analyzeColorFeatures = (imageData, landmarks, width, height) => {
            // Get hair region (top of head)
            const jawLine = landmarks.getJawOutline();
            const topY = Math.max(0, jawLine[0].y - 100);
            const bottomY = jawLine[0].y;
            const leftX = Math.max(0, jawLine[0].x - 50);
            const rightX = Math.min(width, jawLine[16].x + 50);
            
            let hairR = 0, hairG = 0, hairB = 0;
            let hairSamples = 0;
            
            // Sample hair region
            for (let y = Math.floor(topY); y < Math.floor(bottomY); y += 5) {
                for (let x = Math.floor(leftX); x < Math.floor(rightX); x += 5) {
                    const idx = (y * width + x) * 4;
                    if (idx < imageData.data.length - 2) {
                        hairR += imageData.data[idx];
                        hairG += imageData.data[idx + 1];
                        hairB += imageData.data[idx + 2];
                        hairSamples++;
                    }
                }
            }
            
            hairR /= hairSamples;
            hairG /= hairSamples;
            hairB /= hairSamples;
            
            // Determine hair type based on color variance and brightness
            const hairBrightness = (hairR + hairG + hairB) / 3;
            const hairVariance = Math.sqrt((Math.pow(hairR - hairBrightness, 2) + Math.pow(hairG - hairBrightness, 2) + Math.pow(hairB - hairBrightness, 2)) / 3);
            
            let hairType;
            if (hairVariance > 30) {
                hairType = "Curly (3A-3C)";
            } else if (hairVariance > 15) {
                hairType = "Wavy (2A-2C)";
            } else if (hairBrightness > 150) {
                hairType = "Straight (1A-1C)";
            } else {
                hairType = "Coily (4A-4C)";
            }
            
            // Get skin region (center of face)
            const nose = landmarks.getNose();
            const centerX = nose[3].x;
            const centerY = nose[3].y;
            
            let skinR = 0, skinG = 0, skinB = 0;
            let skinSamples = 0;
            
            // Sample skin around nose area
            const sampleRadius = 30;
            for (let y = Math.floor(centerY - sampleRadius); y < Math.floor(centerY + sampleRadius); y += 3) {
                for (let x = Math.floor(centerX - sampleRadius); x < Math.floor(centerX + sampleRadius); x += 3) {
                    const idx = (y * width + x) * 4;
                    if (idx >= 0 && idx < imageData.data.length - 2) {
                        skinR += imageData.data[idx];
                        skinG += imageData.data[idx + 1];
                        skinB += imageData.data[idx + 2];
                        skinSamples++;
                    }
                }
            }
            
            skinR /= skinSamples;
            skinG /= skinSamples;
            skinB /= skinSamples;
            
            // Classify skin tone
            const skinBrightness = (skinR + skinG + skinB) / 3;
            let skinTone;
            if (skinBrightness > 220) {
                skinTone = "Fair Porcelain";
            } else if (skinBrightness > 180) {
                skinTone = "Light Beige";
            } else if (skinBrightness > 140) {
                skinTone = "Medium Tan";
            } else if (skinBrightness > 100) {
                skinTone = "Olive Bronze";
            } else if (skinBrightness > 60) {
                skinTone = "Deep Mahogany";
            } else {
                skinTone = "Rich Ebony";
            }
            
            return { skinTone, hairType };
        };

        // Optimized export functionality
        const exportResults = async (image, results) => {
            const exportDiv = document.createElement('div');
            exportDiv.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:600px;padding:30px;background:#030303;color:#fff;font-family:Space Grotesk,sans-serif;';
            exportDiv.innerHTML = `
                <div style="text-align:center;margin-bottom:20px;">
                    <h1 style="font-size:28px;font-weight:bold;background:linear-gradient(135deg,#fff 0%,#a5b4fc 50%,#6366f1 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">ASH VISION</h1>
                    <p style="color:#888;margin-top:8px;font-size:12px;">Biometric Analysis Report</p>
                </div>
                <img src="${image}" style="width:200px;height:200px;object-fit:cover;border-radius:15px;margin:0 auto 20px;display:block;" />
                <div style="text-align:center;margin-bottom:20px;">
                    <div style="font-size:56px;font-weight:100;">${results.score}/10</div>
                    <div style="color:#888;margin-top:8px;font-size:14px;">${results.faceShape}</div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;">
                    ${results.metrics.slice(0, 4).map(m => `
                        <div style="background:rgba(255,255,255,0.05);padding:15px;border-radius:12px;">
                            <div style="color:#6366f1;font-size:10px;margin-bottom:8px;">${m.label}</div>
                            <div style="font-size:24px;font-weight:100;">${m.value}</div>
                        </div>
                    `).join('')}
                </div>
                <div style="text-align:center;margin-top:30px;color:#444;font-size:10px;">Generated by ASH VISION • ${new Date().toLocaleDateString()}</div>
            `;
            document.body.appendChild(exportDiv);

            const canvas = await html2canvas(exportDiv, { 
                backgroundColor: '#030303',
                scale: 1.5,
                logging: false
            });
            document.body.removeChild(exportDiv);

            const link = document.createElement('a');
            link.download = `ash-vision-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/jpeg', 0.9);
            link.click();
        };

        const App = () => {
            const [image, setImage] = useState(null);
            const [image2, setImage2] = useState(null);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [results, setResults] = useState(null);
            const [results2, setResults2] = useState(null);
            const [status, setStatus] = useState("");
            const [progress, setProgress] = useState(0);
            const [showOnboarding, setShowOnboarding] = useState(false);
            const [showHistory, setShowHistory] = useState(false);
            const [showComparison, setShowComparison] = useState(false);
            const [comparisonMode, setComparisonMode] = useState(false);
            const [history, setHistory] = useState([]);
            const [useCamera, setUseCamera] = useState(false);
            const fileInputRef = useRef(null);
            const videoRef = useRef(null);
            const streamRef = useRef(null);

            useEffect(() => {
                const hasSeenOnboarding = localStorage.getItem('ashVisionOnboarding');
                if (!hasSeenOnboarding) {
                    setShowOnboarding(true);
                    localStorage.setItem('ashVisionOnboarding', 'true');
                }

                const savedHistory = localStorage.getItem('ashVisionHistory');
                if (savedHistory) {
                    setHistory(JSON.parse(savedHistory));
                }
            }, []);

            const saveToHistory = useCallback((img, res) => {
                const newHistory = [{ image: img, results: res, date: new Date().toISOString() }, ...history].slice(0, 10);
                setHistory(newHistory);
                localStorage.setItem('ashVisionHistory', JSON.stringify(newHistory));
            }, [history]);

            const clearHistory = useCallback(() => {
                setHistory([]);
                localStorage.removeItem('ashVisionHistory');
            }, []);

            const handleFile = useCallback((e, isSecondImage = false) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (f) => {
                        if (isSecondImage) {
                            setImage2(f.target.result);
                        } else {
                            setImage(f.target.result);
                        }
                    };
                    reader.readAsDataURL(file);
                }
            }, []);

            const startCamera = useCallback(async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: 'user', width: 1280, height: 720 } 
                    });
                    streamRef.current = stream;
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                    }
                    setUseCamera(true);
                } catch (err) {
                    alert('Camera access denied or unavailable');
                }
            }, []);

            const capturePhoto = useCallback(() => {
                const video = videoRef.current;
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const photo = canvas.toDataURL('image/jpeg', 0.85);
                setImage(photo);
                stopCamera();
            }, []);

            const stopCamera = useCallback(() => {
                if (streamRef.current) {
                    streamRef.current.getTracks().forEach(track => track.stop());
                    streamRef.current = null;
                }
                setUseCamera(false);
            }, []);

            const startAnalysis = useCallback(async () => {
                setIsAnalyzing(true);
                setProgress(0);
                
                try {
                    const res = await analyzeAesthetics(image, ({ status: s, progress: p }) => {
                        setStatus(s);
                        setProgress(p);
                    });
                    
                    setProgress(100);
                    setResults(res);
                    saveToHistory(image, res);

                    if (comparisonMode && image2) {
                        const res2 = await analyzeAesthetics(image2, ({ status: s }) => setStatus(s));
                        setResults2(res2);
                    }
                } catch (error) {
                    alert(error.message || 'Analysis failed. Please try a different photo.');
                }
                
                setIsAnalyzing(false);
            }, [image, image2, comparisonMode, saveToHistory]);

            const resetAnalysis = useCallback(() => {
                setImage(null);
                setImage2(null);
                setResults(null);
                setResults2(null);
                setComparisonMode(false);
            }, []);

            return (
                <div className="min-h-screen pb-24 px-4 sm:px-12">
                    <div className="fixed inset-0 pointer-events-none opacity-50">
                        <div className="absolute top-[-20%] left-[-10%] w-[70%] h-[70%] bg-indigo-600/5 blur-[100px]" />
                        <div className="absolute bottom-[-20%] right-[-10%] w-[60%] h-[60%] bg-blue-600/5 blur-[100px]" />
                    </div>

                    <OnboardingModal isOpen={showOnboarding} onClose={() => setShowOnboarding(false)} />
                    <HistoryModal 
                        isOpen={showHistory} 
                        onClose={() => setShowHistory(false)} 
                        history={history}
                        onSelect={(item) => { setImage(item.image); setResults(item.results); }}
                        onClear={clearHistory}
                    />
                    {comparisonMode && image && results && image2 && results2 && (
                        <ComparisonModal 
                            isOpen={showComparison} 
                            onClose={() => setShowComparison(false)}
                            image1={image}
                            results1={results}
                            image2={image2}
                            results2={results2}
                        />
                    )}

                    <header className="relative max-w-7xl mx-auto pt-16 sm:pt-24 pb-16 sm:pb-24">
                        <div className="flex flex-col sm:flex-row items-center justify-between gap-8 sm:gap-0">
                            <div className="flex items-center gap-4 sm:gap-6">
                                <div className="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-indigo-600/10 border border-indigo-500/20 flex items-center justify-center">
                                    <LucideIcon name="scan-face" size={28} className="text-indigo-400" />
                                </div>
                                <div>
                                    <h1 className="text-3xl sm:text-4xl font-bold tracking-tighter text-neon">ASH VISION</h1>
                                    <p className="h-section !text-[10px] !text-white/20 mt-2">Neural Biometric Analysis</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-3">
                                <button
                                    onClick={() => setShowHistory(true)}
                                    className="px-4 py-2 rounded-xl glass-panel hover:border-indigo-500/50 transition-all flex items-center gap-2"
                                >
                                    <LucideIcon name="clock" size={16} />
                                    <span className="text-xs font-semibold">History</span>
                                </button>
                                <button
                                    onClick={() => setShowOnboarding(true)}
                                    className="px-4 py-2 rounded-xl glass-panel hover:border-indigo-500/50 transition-all"
                                >
                                    <LucideIcon name="help-circle" size={16} />
                                </button>
                                <div className="flex items-center gap-3 px-6 py-3 rounded-full glass-panel">
                                    <div className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                                    <span className="text-[10px] font-black tracking-[0.3em] uppercase text-white/40">System Active</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="relative max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-16">
                        <div className="lg:col-span-5 space-y-8">
                            {!comparisonMode ? (
                                <div 
                                    onClick={() => !isAnalyzing && !useCamera && fileInputRef.current?.click()}
                                    className={`glass-panel rounded-[4rem] overflow-hidden aspect-[3/4] relative group ${!isAnalyzing && !useCamera ? 'cursor-pointer' : ''}`}
                                >
                                    {useCamera ? (
                                        <div className="relative h-full">
                                            <video ref={videoRef} autoPlay playsInline className="w-full h-full object-cover" />
                                            <div className="absolute bottom-8 left-0 right-0 flex justify-center gap-4">
                                                <button
                                                    onClick={(e) => { e.stopPropagation(); capturePhoto(); }}
                                                    className="px-8 py-4 bg-indigo-600 hover:bg-indigo-500 rounded-2xl font-bold flex items-center gap-2 transition-colors"
                                                >
                                                    <LucideIcon name="camera" size={20} />
                                                    Capture
                                                </button>
                                                <button
                                                    onClick={(e) => { e.stopPropagation(); stopCamera(); }}
                                                    className="px-8 py-4 bg-red-500/20 hover:bg-red-500/30 rounded-2xl font-bold transition-colors"
                                                >
                                                    Cancel
                                                </button>
                                            </div>
                                        </div>
                                    ) : image ? (
                                        <div className="relative h-full">
                                            <img src={image} className="w-full h-full object-cover" alt="Subject" />
                                            {isAnalyzing && (
                                                <div className="absolute inset-0 bg-black/80 backdrop-blur-sm flex flex-col items-center justify-center p-12">
                                                    <div className="laser-scan-vertical"></div>
                                                    <div className="laser-scan-horizontal"></div>
                                                    <div className="scan-grid"></div>
                                                    <div className="corner-marker corner-tl"></div>
                                                    <div className="corner-marker corner-tr"></div>
                                                    <div className="corner-marker corner-bl"></div>
                                                    <div className="corner-marker corner-br"></div>
                                                    
                                                    <div className="relative w-32 h-32 mb-12 z-20">
                                                        <div className="absolute inset-0 border-4 border-indigo-500/20 rounded-full" />
                                                        <div className="absolute inset-0 border-t-4 border-indigo-500 rounded-full animate-spin" />
                                                        <LucideIcon name="scan" size={48} className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-indigo-400" />
                                                    </div>
                                                    
                                                    <div className="w-full max-w-xs space-y-4 z-20">
                                                        <p className="h-section !text-indigo-400 animate-pulse text-center">{status}</p>
                                                        <div className="progress-bar-container">
                                                            <div className="progress-bar" style={{ width: `${progress}%` }} />
                                                        </div>
                                                        <p className="text-center text-xs text-white/30">{progress}%</p>
                                                    </div>
                                                </div>
                                            )}
                                            {!isAnalyzing && (
                                                <button 
                                                    onClick={(e) => { e.stopPropagation(); resetAnalysis(); }}
                                                    className="absolute top-8 right-8 w-14 h-14 rounded-2xl bg-black/50 backdrop-blur-md border border-white/10 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity hover:bg-black/70 hover:border-white/30"
                                                >
                                                    <LucideIcon name="x" size={20} className="text-white" />
                                                </button>
                                            )}
                                            {results && results.qualityIssues && results.qualityIssues.length > 0 && (
                                                <div className="absolute top-8 left-8 glass-panel px-4 py-2 rounded-xl border-yellow-500/30">
                                                    <div className="flex items-center gap-2 text-yellow-400 text-xs">
                                                        <LucideIcon name="alert-triangle" size={14} />
                                                        {results.qualityIssues[0]}
                                                    </div>
                                                </div>
                                            )}
                                            {results && results.confidence && (
                                                <div className="absolute bottom-8 left-8 glass-panel px-4 py-2 rounded-xl">
                                                    <div className="flex items-center gap-2 text-indigo-400 text-xs">
                                                        <LucideIcon name="zap" size={14} />
                                                        Confidence: {results.confidence}%
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    ) : (
                                        <div className="h-full flex flex-col items-center justify-center p-16 text-center space-y-8">
                                            <div className="w-32 h-32 rounded-[3rem] bg-white/5 border border-white/5 flex items-center justify-center group-hover:scale-110 group-hover:border-indigo-500/30 transition-all duration-700 shadow-2xl">
                                                <LucideIcon name="image-plus" size={48} className="text-white/20 group-hover:text-white transition-colors" />
                                            </div>
                                            <div className="space-y-4">
                                                <h3 className="text-3xl font-light tracking-tight">Upload Subject</h3>
                                                <p className="h-section !text-white/30 !leading-relaxed max-w-xs mx-auto">Neural mapping requires a neutral, front-facing biometric capture</p>
                                            </div>
                                            <input type="file" ref={fileInputRef} onChange={handleFile} className="hidden" accept="image/*" />
                                        </div>
                                    )}
                                </div>
                            ) : (
                                <div className="grid grid-cols-2 gap-4">
                                    <div 
                                        onClick={() => !isAnalyzing && fileInputRef.current?.click()}
                                        className="glass-panel rounded-3xl overflow-hidden aspect-square relative cursor-pointer group"
                                    >
                                        {image ? (
                                            <img src={image} className="w-full h-full object-cover" alt="Photo 1" />
                                        ) : (
                                            <div className="h-full flex items-center justify-center">
                                                <LucideIcon name="image-plus" size={32} className="text-white/20" />
                                            </div>
                                        )}
                                    </div>
                                    <div 
                                        onClick={() => !isAnalyzing && fileInputRef.current?.click()}
                                        className="glass-panel rounded-3xl overflow-hidden aspect-square relative cursor-pointer group"
                                    >
                                        {image2 ? (
                                            <img src={image2} className="w-full h-full object-cover" alt="Photo 2" />
                                        ) : (
                                            <div className="h-full flex items-center justify-center">
                                                <LucideIcon name="image-plus" size={32} className="text-white/20" />
                                            </div>
                                        )}
                                    </div>
                                    <input 
                                        type="file" 
                                        ref={fileInputRef} 
                                        onChange={(e) => handleFile(e, !!image)} 
                                        className="hidden" 
                                        accept="image/*" 
                                    />
                                </div>
                            )}

                            <div className="flex gap-4">
                                {!useCamera && !image && (
                                    <button
                                        onClick={startCamera}
                                        className="flex-1 py-4 rounded-3xl glass-panel hover:border-indigo-500/50 transition-all flex items-center justify-center gap-2 font-semibold"
                                    >
                                        <LucideIcon name="camera" size={18} />
                                        Use Camera
                                    </button>
                                )}
                                <button
                                    onClick={() => setComparisonMode(!comparisonMode)}
                                    className={`flex-1 py-4 rounded-3xl glass-panel hover:border-indigo-500/50 transition-all flex items-center justify-center gap-2 font-semibold ${comparisonMode ? 'border-indigo-500/50' : ''}`}
                                >
                                    <LucideIcon name="git-compare" size={18} />
                                    Compare
                                </button>
                            </div>

                            <button 
                                disabled={!image || isAnalyzing}
                                onClick={startAnalysis}
                                className={`w-full py-8 rounded-[3rem] sm:rounded-[4rem] text-[11px] font-black tracking-[0.6em] uppercase transition-all duration-700 active:scale-95 ${!image ? 'bg-white/5 text-white/10' : 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-[0_0_60px_rgba(99,102,241,0.3)]'}`}
                            >
                                {isAnalyzing ? 'Mapping Mesh...' : 'Begin Biometric Scan'}
                            </button>

                            {results && (
                                <button
                                    onClick={() => exportResults(image, results)}
                                    className="w-full py-4 rounded-3xl glass-panel hover:border-indigo-500/50 transition-all flex items-center justify-center gap-2 font-semibold"
                                >
                                    <LucideIcon name="download" size={18} />
                                    Export Results
                                </button>
                            )}
                        </div>

                        <div className="lg:col-span-7 space-y-16">
                            {!results ? (
                                <div className="h-full min-h-[500px] glass-panel rounded-[4rem] border-dashed border-white/10 flex flex-col items-center justify-center p-20 opacity-30">
                                    <LucideIcon name="cpu" size={60} className="mb-10 animate-pulse text-indigo-400" />
                                    <p className="h-section">Network Idle: Sync Needed</p>
                                </div>
                            ) : (
                                <div className="space-y-16 animate-in fade-in slide-in-from-right-10 duration-1000 pb-20">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-8">
                                        <div className="glass-panel p-12 rounded-[4rem] flex flex-col justify-between interactive-card group border-t-white/10">
                                            <h2 className="h-section !text-indigo-400">Harmony Score</h2>
                                            <div className="flex items-baseline gap-3 mt-8">
                                                <span className="text-9xl font-thin tracking-tighter text-neon leading-none">{results.score}</span>
                                                <span className="text-2xl text-white/10 font-bold">/10</span>
                                            </div>
                                        </div>
                                        <div className="glass-panel p-12 rounded-[4rem] interactive-card border-t-white/10 flex flex-col justify-center">
                                            <h2 className="h-section">Facial Architecture</h2>
                                            <h3 className="text-4xl sm:text-5xl font-light mt-6 tracking-tighter leading-tight">{results.faceShape}</h3>
                                            <p className="text-[10px] text-white/30 uppercase tracking-[0.4em] mt-8 font-black leading-loose border-l-2 border-indigo-500/20 pl-4">Structural classification: Elite</p>
                                        </div>
                                    </div>

                                    <MetricSection metrics={results.metrics} />

                                    <div className="glass-panel rounded-[3.5rem] overflow-hidden">
                                        <div className="px-10 py-8 border-b border-white/5 flex items-center gap-4 bg-white/[0.01]">
                                            <LucideIcon name="fingerprint" size={20} className="text-indigo-400" />
                                            <h2 className="h-section">Biometric Phenotypes</h2>
                                        </div>
                                        <div className="p-8 sm:p-12 grid grid-cols-1 sm:grid-cols-2 gap-6">
                                            {results.features.map((feat) => (
                                                <div key={feat.key} className="p-8 rounded-[2.5rem] bg-white/[0.02] border border-white/5 hover:border-indigo-500/30 transition-all flex flex-col gap-6 group">
                                                    <div className="flex items-center gap-3 opacity-30 group-hover:opacity-100 transition-opacity">
                                                        <LucideIcon name={feat.sectionIcon} size={14} className="text-indigo-400" />
                                                        <span className="h-section !text-[9px] !tracking-[0.2em]">{feat.key}</span>
                                                    </div>
                                                    <div className="flex items-center gap-4">
                                                        <div className={`flex items-center justify-center transition-transform group-hover:scale-110`}>
                                                            <LucideIcon name={feat.resultIcon} size={28} className={feat.color} />
                                                        </div>
                                                        <span className="text-xl sm:text-2xl font-light tracking-tight uppercase leading-tight">{feat.val}</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="space-y-8">
                                        <div className="flex items-center gap-4 px-10">
                                            <LucideIcon name="zap" size={20} className="text-indigo-400" />
                                            <h2 className="h-section">Optimization Protocols</h2>
                                        </div>
                                        <div className="grid grid-cols-1 gap-6 px-2 sm:px-0">
                                            {Object.entries(results.advice).map(([key, item]) => (
                                                <div key={key} className="glass-panel rounded-[3rem] p-8 sm:p-10 flex flex-col md:flex-row gap-8 items-center interactive-card border-t-white/10">
                                                    <div className="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-indigo-500/10 flex items-center justify-center shrink-0 border border-indigo-500/10">
                                                        <LucideIcon name={item.icon} size={28} className="text-indigo-400" />
                                                    </div>
                                                    <div className="flex-1 space-y-4 text-center md:text-left">
                                                        <h4 className="text-xl sm:text-2xl font-medium tracking-tight text-white/90 uppercase">{key.charAt(0).toUpperCase() + key.slice(1)} Strategy</h4>
                                                        <div>
                                                            <h5 className="text-2xl sm:text-3xl font-light tracking-tighter uppercase leading-none text-indigo-400 mb-4">{item.title}</h5>
                                                            <div className="flex flex-wrap justify-center md:justify-start gap-2">
                                                                {item.points.map((p, i) => (
                                                                    <div key={i} className="px-3 py-1.5 rounded-lg bg-white/[0.03] border border-white/5 flex items-center gap-2">
                                                                        <div className="w-1 h-1 rounded-full bg-indigo-500/50" />
                                                                        <span className="text-[9px] font-bold text-white/40 uppercase tracking-widest">{p}</span>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    <footer className="max-w-7xl mx-auto mt-32 pt-24 border-t border-white/5 text-center">
                        <div className="flex justify-center gap-12 opacity-20 mb-12">
                            <LucideIcon name="globe" /> <LucideIcon name="shield-check" /> <LucideIcon name="cpu" />
                        </div>
                        <p className="h-section !text-white/10 !tracking-[1em]">ASH Vision System • Encrypted Node 2026</p>
                        <p className="text-sm text-indigo-500/30 mt-8 italic font-light tracking-wide">Crafted by Hussain • Terminal 7-B Secure Access</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
