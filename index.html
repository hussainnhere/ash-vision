<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASH VISION | Advanced Analytics</title>
    
    <!-- Load UI Frameworks -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @keyframes scan { 
            0% { top: 0%; opacity: 0; } 
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { top: 100%; opacity: 0; } 
        }
        
        body { 
            background-color: #050505; 
            color: white; 
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .glass-card { 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .scanning-bar {
            height: 3px;
            width: 100%;
            background: linear-gradient(90deg, transparent, #6366f1, transparent);
            position: absolute;
            z-index: 20;
            animation: scan 2.5s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.8);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #222; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- React Implementation -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // Icon Component with automatic initialization
        const LucideIcon = ({ name, size = 18, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const analyzeAesthetics = (imageSrc) => {
            // deterministic but looks random based on image data
            const seed = imageSrc.length;
            const score = (8.5 + (seed % 15) / 10).toFixed(1);
            const symmetry = 88 + (seed % 10);
            const jawline = 90 + (seed % 8);

            return {
                score,
                faceShape: "Angular Diamond",
                advice: {
                    hair: "Mid-length textured layers to balance high cheekbones.",
                    eyewear: "Classic Wayfarer frames to add width to the jawline.",
                    grooming: "Defined stubble to emphasize lower facial structure."
                },
                metrics: [
                    { label: 'Bilateral Symmetry', value: symmetry, status: 'Elite' },
                    { label: 'Jawline Definition', value: jawline, status: 'Prominent' },
                    { label: 'Golden Ratio Match', value: 92, status: 'Optimal' }
                ]
            };
        };

        const App = () => {
            const [image, setImage] = useState(null);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [results, setResults] = useState(null);
            const fileInputRef = useRef(null);

            const handleFile = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (f) => { 
                        setImage(f.target.result); 
                        setResults(null); 
                    };
                    reader.readAsDataURL(file);
                }
            };

            const runAnalysis = () => {
                if (!image) return;
                setIsAnalyzing(true);
                // Simulated deep scan
                setTimeout(() => {
                    setResults(analyzeAesthetics(image));
                    setIsAnalyzing(false);
                }, 2800);
            };

            return (
                <div className="min-h-screen p-6 md:p-12 lg:p-20 max-w-6xl mx-auto flex flex-col">
                    <header className="flex justify-between items-center mb-12">
                        <div className="flex items-center gap-4">
                            <div className="w-12 h-12 bg-white rounded-2xl flex items-center justify-center shadow-lg shadow-white/5">
                                <LucideIcon name="scan" className="text-black" size={24} />
                            </div>
                            <div>
                                <h1 className="text-2xl font-light tracking-[0.3em] uppercase">ASH <span className="font-bold">VISION</span></h1>
                                <p className="text-[10px] text-white/30 tracking-widest uppercase font-bold">Biometric Analysis v4.0</p>
                            </div>
                        </div>
                        <div className="hidden md:flex items-center gap-2 px-4 py-2 bg-white/5 rounded-full border border-white/10">
                            <span className="w-2 h-2 bg-indigo-500 rounded-full animate-pulse"></span>
                            <span className="text-[10px] font-black uppercase tracking-widest text-white/50">Neural Link Active</span>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 items-start">
                        {/* Media Input Container */}
                        <div className="space-y-6">
                            <div 
                                onClick={() => !isAnalyzing && fileInputRef.current.click()} 
                                className="aspect-[4/5] glass-card rounded-[2.5rem] overflow-hidden relative cursor-pointer group transition-all duration-500 hover:border-white/20"
                            >
                                {image ? (
                                    <div className="h-full w-full relative">
                                        <img src={image} className="h-full w-full object-cover" alt="User scan" />
                                        {isAnalyzing && <div className="scanning-bar"></div>}
                                        <div className="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-end p-8">
                                            <p className="text-[10px] font-bold uppercase tracking-widest">Click to retake photo</p>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="h-full flex flex-col items-center justify-center p-12 text-center">
                                        <div className="w-20 h-20 bg-white/5 rounded-full flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                                            <LucideIcon name="camera" size={32} className="text-white/20" />
                                        </div>
                                        <h2 className="text-sm font-bold uppercase tracking-widest mb-2">Initialize Scanner</h2>
                                        <p className="text-xs text-white/30 leading-relaxed">Upload a clear, front-facing portrait for accurate biometric harmony calculation.</p>
                                    </div>
                                )}
                                <input type="file" ref={fileInputRef} onChange={handleFile} className="hidden" accept="image/*" />
                            </div>
                            
                            <button 
                                onClick={runAnalysis} 
                                disabled={!image || isAnalyzing} 
                                className="w-full py-6 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-10 disabled:grayscale rounded-3xl font-black uppercase tracking-[0.4em] text-[11px] transition-all shadow-2xl shadow-indigo-600/20 active:scale-[0.98]"
                            >
                                {isAnalyzing ? "Processing Neural Matrix..." : "Begin Aesthetic Analysis"}
                            </button>
                        </div>

                        {/* Analysis Output Container */}
                        <div className="space-y-6">
                            {!results ? (
                                <div className="h-full min-h-[400px] glass-card rounded-[2.5rem] flex flex-col items-center justify-center p-12 text-center border-dashed">
                                    <LucideIcon name="cpu" size={40} className="text-white/5 mb-6" />
                                    <p className="text-[10px] uppercase font-black tracking-[0.4em] text-white/20">Waiting for Data Stream</p>
                                </div>
                            ) : (
                                <div className="space-y-6 animate-in fade-in slide-in-from-right-8 duration-1000">
                                    {/* Score Card */}
                                    <div className="glass-card p-10 rounded-[2.5rem] relative overflow-hidden">
                                        <div className="absolute top-0 right-0 p-6 opacity-10">
                                            <LucideIcon name="award" size={80} />
                                        </div>
                                        <span className="text-[11px] text-indigo-400 uppercase font-black tracking-widest block mb-4">Harmony Quotient</span>
                                        <div className="flex items-baseline gap-3">
                                            <span className="text-8xl font-light tracking-tighter">{results.score}</span>
                                            <span className="text-2xl text-white/20 font-bold uppercase tracking-tighter">PRIME</span>
                                        </div>
                                    </div>

                                    {/* Metrics Grid */}
                                    <div className="grid grid-cols-1 gap-4">
                                        {results.metrics.map((m, i) => (
                                            <div key={i} className="glass-card p-6 rounded-3xl flex justify-between items-center">
                                                <div>
                                                    <p className="text-[10px] font-black uppercase tracking-widest text-white/40 mb-1">{m.label}</p>
                                                    <span className="text-[9px] px-2 py-0.5 bg-indigo-500/20 text-indigo-300 rounded-md font-bold uppercase tracking-tighter">{m.status}</span>
                                                </div>
                                                <div className="text-2xl font-light">{m.value}%</div>
                                            </div>
                                        ))}
                                    </div>

                                    {/* Advisory Panel */}
                                    <div className="glass-card p-10 rounded-[2.5rem] space-y-8">
                                        <div className="flex items-center gap-4">
                                            <div className="p-3 bg-white/5 rounded-xl text-indigo-400">
                                                <LucideIcon name="sparkles" size={20} />
                                            </div>
                                            <h3 className="text-[11px] font-black uppercase tracking-[0.3em]">AI Grooming Advisory</h3>
                                        </div>
                                        
                                        <div className="grid grid-cols-1 gap-8">
                                            {[
                                                { label: 'Hair Styling', val: results.advice.hair, icon: 'scissors' },
                                                { label: 'Optical/Eyewear', val: results.advice.eyewear, icon: 'glasses' },
                                                { label: 'Facial Grooming', val: results.advice.grooming, icon: 'user' }
                                            ].map((item, idx) => (
                                                <div key={idx} className="flex gap-4">
                                                    <div className="text-white/20 pt-1">
                                                        <LucideIcon name={item.icon} size={14} />
                                                    </div>
                                                    <div className="space-y-1">
                                                        <span className="text-[10px] font-bold uppercase text-white/30 tracking-widest">{item.label}</span>
                                                        <p className="text-sm text-white/80 leading-relaxed font-medium">{item.val}</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    <footer className="mt-24 pt-12 border-t border-white/5 flex flex-col md:flex-row justify-between items-center gap-6">
                        <div className="text-[10px] text-white/10 uppercase font-black tracking-[0.6em]">ASH VISION LABS • 2026</div>
                        <div className="flex items-center gap-6">
                            <span className="text-[11px] font-light italic text-white/30 tracking-widest">Engineered by Hussain</span>
                            <div className="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center border border-white/10 hover:bg-white/10 transition-colors cursor-pointer">
                                <LucideIcon name="github" size={14} className="opacity-40" />
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
