<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASH VISION | Advanced Analytics</title>
    
    <!-- Load UI Frameworks -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @keyframes scan { 
            0% { top: 0%; opacity: 0; } 
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { top: 100%; opacity: 0; } 
        }
        
        body { 
            background-color: #050505; 
            color: white; 
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .glass-card { 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .scanning-bar {
            height: 3px;
            width: 100%;
            background: linear-gradient(90deg, transparent, #6366f1, transparent);
            position: absolute;
            z-index: 20;
            animation: scan 2.5s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.8);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #222; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- React Implementation -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        /**
         * Optimized LucideIcon Component
         * Solves 'NotFoundError' by preventing React from tracking the DOM node 
         * that Lucide library replaces/destroys.
         */
        const LucideIcon = ({ name, size = 18, className = "" }) => {
            const ref = useRef(null);

            useEffect(() => {
                if (window.lucide && ref.current) {
                    window.lucide.createIcons({
                        root: ref.current,
                        nameAttr: 'data-lucide',
                        attrs: {
                            width: size,
                            height: size,
                            class: className
                        }
                    });
                }
            }, [name, size, className]);

            // Using dangerouslySetInnerHTML acts as a boundary. 
            // React manages the <span>, but ignores DOM changes happening inside it.
            return (
                <span 
                    ref={ref} 
                    style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}
                    dangerouslySetInnerHTML={{ __html: `<i data-lucide="${name}"></i>` }} 
                />
            );
        };

        const MetricCard = ({ metric }) => {
            const [isExpanded, setIsExpanded] = useState(false);

            return (
                <div className={`transition-all duration-500 overflow-hidden border-b border-white/5 last:border-0 ${isExpanded ? 'bg-white/[0.02]' : 'hover:bg-white/[0.01]'}`}>
                    <div 
                        onClick={() => setIsExpanded(!isExpanded)}
                        className="p-6 sm:p-8 cursor-pointer flex flex-col sm:flex-row justify-between items-start gap-4"
                    >
                        <div className="flex-1 space-y-1">
                            <div className="flex items-center gap-2">
                                <h4 className="text-[10px] font-black uppercase tracking-widest text-white/90">{metric.label}</h4>
                                <span className={`text-[8px] px-2 py-0.5 rounded-full font-bold uppercase ${
                                    metric.status === 'Elite' ? 'bg-indigo-500/20 text-indigo-400' : 'bg-green-500/20 text-green-400'
                                }`}>
                                    {metric.status}
                                </span>
                            </div>
                            <p className="text-[11px] text-white/40 leading-relaxed max-w-md">{metric.insight}</p>
                        </div>
                        
                        <div className="w-full sm:w-auto flex items-center justify-between sm:justify-end gap-6">
                            <div className="flex flex-col items-end">
                                <span className="text-2xl font-light tabular-nums">{metric.value}%</span>
                                <div className="w-24 h-1 bg-white/10 rounded-full mt-1 overflow-hidden">
                                    <div className="h-full bg-indigo-500 transition-all duration-1000" style={{ width: `${metric.value}%` }} />
                                </div>
                            </div>
                            <div className={`p-2 rounded-full transition-transform duration-300 ${isExpanded ? 'rotate-180 bg-white/5' : ''}`}>
                                <LucideIcon name="chevron-down" size={16} className="text-white/20" />
                            </div>
                        </div>
                    </div>

                    {isExpanded && (
                        <div className="px-6 pb-8 sm:px-8 sm:pb-10 animate-in fade-in slide-in-from-top-2 duration-500">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8 pt-4 border-t border-white/5">
                                <div className="space-y-4">
                                    <div className="flex items-center gap-2 text-indigo-400">
                                        <LucideIcon name="info" size={14} />
                                        <span className="text-[9px] font-black uppercase tracking-widest">Scientific Basis</span>
                                    </div>
                                    <p className="text-[11px] sm:text-xs text-white/60 leading-relaxed font-light">
                                        {metric.deepDive.explanation}
                                    </p>
                                </div>
                                
                                <div className="space-y-4">
                                    <div className="flex items-center gap-2 text-green-400">
                                        <LucideIcon name="zap" size={14} />
                                        <span className="text-[9px] font-black uppercase tracking-widest">Optimization Path</span>
                                    </div>
                                    <ul className="space-y-3">
                                        {metric.deepDive.tips.map((tip, idx) => (
                                            <li key={idx} className="flex gap-3 text-[11px] sm:text-xs text-white/80 leading-relaxed">
                                                <LucideIcon name="check-circle-2" size={12} className="shrink-0 mt-0.5 text-green-500/50" />
                                                {tip}
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const analyzeAesthetics = (imageSrc) => {
            const seed = imageSrc.length;
            const prng = (offset) => {
                const x = Math.sin(seed + offset) * 10000;
                return x - Math.floor(x);
            };

            const symmetry = Math.floor(prng(1) * 12) + 85;
            const goldenRatioMatch = Math.floor(prng(2) * 15) + 82;
            const mandibularAngle = Math.floor(prng(3) * 10) + 115; 
            
            const score = ((symmetry * 0.4 + goldenRatioMatch * 0.4 + (100 - Math.abs(120 - mandibularAngle)) * 0.2) / 10).toFixed(1);

            const shapes = ["Oval-Angular", "Diamond-Structured", "Square-Defined", "Heart-Balanced"];
            const faceShape = shapes[Math.floor(prng(7) * shapes.length)];

            const getStylingAdvice = (shape) => {
                const adviceMap = {
                    "Oval-Angular": {
                        hair: "Volume on top with short sides (Quiff or Pompadour) to maintain natural symmetry.",
                        eyewear: "Rectangular or square frames to add contrast to rounded edges.",
                        grooming: "Short boxed beard to accentuate the jawline without hiding the chin."
                    },
                    "Diamond-Structured": {
                        hair: "Longer, layered styles or a textured fringe to add width to the forehead.",
                        eyewear: "Aviators or Clubmasters (browline) to balance wide cheekbones.",
                        grooming: "Fuller beard on the chin area to provide more weight to the lower third."
                    },
                    "Square-Defined": {
                        hair: "Close fades or buzz cuts to highlight bone structure; alternatively, messy texture to soften edges.",
                        eyewear: "Round or oval frames to contrast with the sharp jawline.",
                        grooming: "Heavy stubble or a clean-shaven look to maximize jaw angularity."
                    },
                    "Heart-Balanced": {
                        hair: "Mid-length styles that fall naturally; avoid too much volume on top which widens the forehead.",
                        eyewear: "Wayfarers or bottom-heavy frames to add width to the lower face.",
                        grooming: "A full beard is highly recommended to fill out the narrow chin area."
                    }
                };
                return adviceMap[shape] || adviceMap["Oval-Angular"];
            };

            const advice = getStylingAdvice(faceShape);

            return {
                score,
                faceShape,
                summary: "High structural harmony with optimized bigonial width and positive orbital vectors.",
                advice,
                metrics: [
                    {
                        id: 'symmetry',
                        label: 'Bilateral Symmetry',
                        value: symmetry,
                        status: symmetry > 90 ? 'Elite' : 'Optimal',
                        insight: "Minimal deviation across the sagittal plane. Correlates with high perceived health markers.",
                        deepDive: {
                            explanation: "Bilateral symmetry measures the correspondence of features across the midline. Small deviations are normal, but high symmetry is a primary marker of genetic robustness.",
                            tips: [
                                "Sleep exclusively on your back to prevent soft-tissue compression.",
                                "Switch chewing sides regularly to ensure equal development of masseter muscles.",
                                "Consult a physical therapist for neck posture correction."
                            ]
                        }
                    },
                    {
                        id: 'golden',
                        label: 'Divine Proportions (Phi)',
                        value: goldenRatioMatch,
                        status: 'High Match',
                        insight: `Proximity to 1.618 ratio: ${goldenRatioMatch}%. Features follow the Fibonacci sequence.`,
                        deepDive: {
                            explanation: "The Golden Ratio ($1:1.618$) measures the relationship between face width and length.",
                            tips: [
                                "Use contouring to create the illusion of balanced cheekbone width.",
                                "Eyebrow shaping: Align arch peak with the outer iris.",
                                "Hydration is key to maintaining the 'lift' that keeps these ratios stable."
                            ]
                        }
                    },
                    {
                        id: 'mandibular',
                        label: 'Mandibular Definition',
                        value: 91,
                        status: 'Prominent',
                        insight: `Angular projection detected at approx ${mandibularAngle}°. Low subcutaneous fat visibility.`,
                        deepDive: {
                            explanation: "Mandibular definition refers to the sharpness of the jawline, influenced by masseter volume.",
                            tips: [
                                "Reduce sodium intake to eliminate water retention around the jaw.",
                                "Gua Sha can help sharpen the contour temporarily.",
                                "Hard chewing naturally hypertrophies the jaw muscles over time."
                            ]
                        }
                    }
                ]
            };
        };

        const App = () => {
            const [image, setImage] = useState(null);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [progress, setProgress] = useState(0);
            const [results, setResults] = useState(null);
            const [status, setStatus] = useState("");
            const fileInputRef = useRef(null);

            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (f) => setImage(f.target.result);
                    reader.readAsDataURL(file);
                }
            };

            const processImage = async () => {
                if (!image) return;
                setIsAnalyzing(true);
                setResults(null);
                
                const stages = ["Calibrating Neural Mesh...", "Scanning Ratios...", "Finalizing Matrix..."];
                for (let i = 0; i < stages.length; i++) {
                    setStatus(stages[i]);
                    for (let p = 0; p <= 100; p += 20) {
                        setProgress(((i * 100) + p) / stages.length);
                        await new Promise(r => setTimeout(r, 100));
                    }
                }

                setResults(analyzeAesthetics(image));
                setIsAnalyzing(false);
            };

            return (
                <div className="min-h-screen bg-[#050505] text-white selection:bg-indigo-500/30 overflow-x-hidden">
                    <div className="fixed inset-0 pointer-events-none opacity-20">
                        <div className="absolute top-0 right-0 w-[500px] h-[500px] bg-indigo-600/20 blur-[120px] rounded-full" />
                        <div className="absolute bottom-0 left-0 w-[500px] h-[500px] bg-blue-600/10 blur-[120px] rounded-full" />
                    </div>

                    <div className="relative z-10 max-w-6xl mx-auto px-4 sm:px-8 py-8 sm:py-12">
                        <header className="flex flex-col sm:flex-row items-center justify-between mb-12 sm:mb-20 gap-6">
                            <div className="flex items-center gap-4">
                                <div className="w-12 h-12 bg-white rounded-2xl flex items-center justify-center shadow-[0_0_30px_rgba(255,255,255,0.15)]">
                                    <LucideIcon name="scan" className="text-black" size={24} />
                                </div>
                                <div>
                                    <h1 className="text-2xl font-light tracking-[0.2em] uppercase">ASH <span className="font-bold">VISION</span></h1>
                                    <p className="text-[10px] text-white/30 font-bold tracking-[0.3em] uppercase">Facial Intelligence V3.6.0</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-3">
                                <div className="px-4 py-2 rounded-full glass-card flex items-center gap-2 border-white/5">
                                    <LucideIcon name="activity" size={12} className="text-green-500 animate-pulse" />
                                    <span className="text-[9px] font-black uppercase tracking-widest text-white/60">System Ready</span>
                                </div>
                            </div>
                        </header>

                        <main className="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-16">
                            <div className="lg:col-span-5 space-y-6">
                                <div className={`relative aspect-[3/4] rounded-[2.5rem] overflow-hidden glass-card transition-all duration-700 ${image ? 'border-indigo-500/30' : ''}`}>
                                    {image ? (
                                        <div className="relative w-full h-full">
                                            <img src={image} className="w-full h-full object-cover brightness-90 grayscale-[0.2]" alt="Subject" />
                                            {isAnalyzing && (
                                                <div className="absolute inset-0 z-20 flex flex-col items-center justify-center">
                                                    <div className="absolute inset-0 bg-indigo-900/10 backdrop-blur-[2px]" />
                                                    <div className="h-1 w-full bg-white/50 absolute top-0 animate-[scan_2s_linear_infinite] shadow-[0_0_20px_white]" />
                                                    <div className="relative px-6 py-2 bg-black/60 backdrop-blur-xl rounded-full border border-white/10 text-[10px] font-black tracking-widest uppercase">
                                                        {status}
                                                    </div>
                                                </div>
                                            )}
                                            {!isAnalyzing && (
                                                <button onClick={() => {setImage(null); setResults(null);}} className="absolute bottom-8 left-1/2 -translate-x-1/2 px-6 py-3 glass-card rounded-full text-[10px] font-black tracking-widest hover:bg-white/10 transition-all uppercase border-white/10">
                                                    RESET
                                                </button>
                                            )}
                                        </div>
                                    ) : (
                                        <div className="h-full flex flex-col items-center justify-center p-12 text-center group cursor-pointer" onClick={() => fileInputRef.current.click()}>
                                            <div className="w-20 h-20 rounded-3xl bg-white/5 flex items-center justify-center mb-8 group-hover:bg-white/10 transition-colors">
                                                <LucideIcon name="camera" size={28} className="text-white/20" />
                                            </div>
                                            <h3 className="text-xl font-light mb-2">Initialize Ash Scanner</h3>
                                            <p className="text-[11px] text-white/20 max-w-[200px] leading-relaxed uppercase tracking-tighter">
                                                Forward gaze required for high precision mapping
                                            </p>
                                            <input type="file" ref={fileInputRef} onChange={handleFileChange} className="hidden" accept="image/*" />
                                        </div>
                                    )}
                                </div>
                                
                                <button 
                                    disabled={!image || isAnalyzing}
                                    onClick={processImage}
                                    className={`w-full py-5 rounded-3xl text-[12px] font-black tracking-[0.4em] uppercase transition-all active:scale-[0.98] ${
                                        !image ? 'bg-white/5 text-white/10' : 'bg-indigo-600 hover:bg-indigo-500 shadow-xl shadow-indigo-600/20'
                                    }`}
                                >
                                    {isAnalyzing ? `MAPPING ${Math.round(progress)}%` : 'Begin Deep Analysis'}
                                </button>
                            </div>

                            <div className="lg:col-span-7 space-y-8">
                                {!results ? (
                                    <div className="h-full min-h-[400px] glass-card rounded-[3rem] border-dashed border-white/10 flex flex-col items-center justify-center p-12 opacity-50">
                                        <LucideIcon name="maximize-2" size={32} className="text-white/10 mb-6" />
                                        <p className="text-[10px] font-black uppercase tracking-[0.4em] text-center">Ready for input</p>
                                    </div>
                                ) : (
                                    <div className="animate-in fade-in slide-in-from-right-8 duration-1000 space-y-8 pb-20">
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                            <div className="glass-card p-8 rounded-[2.5rem] relative overflow-hidden group">
                                                <div className="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                                                    <LucideIcon name="zap" size={40} />
                                                </div>
                                                <span className="text-[9px] font-black uppercase tracking-[0.3em] text-white/30 block mb-4">Harmony Score</span>
                                                <div className="flex items-baseline gap-2">
                                                    <span className="text-7xl font-light tracking-tighter">{results.score}</span>
                                                    <span className="text-xl font-bold text-white/20">/10</span>
                                                </div>
                                            </div>

                                            <div className="glass-card p-8 rounded-[2.5rem]">
                                                <span className="text-[9px] font-black uppercase tracking-[0.3em] text-white/30 block mb-4">Morphology</span>
                                                <h3 className="text-3xl font-light tracking-tight mb-2">{results.faceShape}</h3>
                                                <p className="text-[11px] text-white/40 leading-relaxed italic">{results.summary}</p>
                                            </div>
                                        </div>

                                        <div className="glass-card rounded-[3rem] overflow-hidden">
                                            <div className="px-8 py-6 border-b border-white/5 flex items-center justify-between">
                                                <div className="flex items-center gap-3">
                                                    <LucideIcon name="layers" size={16} className="text-indigo-500" />
                                                    <h2 className="text-[11px] font-black uppercase tracking-[0.3em]">Scientific Metrics</h2>
                                                </div>
                                            </div>
                                            <div className="flex flex-col">
                                                {results.metrics.map(m => <MetricCard key={m.id} metric={m} />)}
                                            </div>
                                        </div>

                                        <div className="glass-card rounded-[3rem] overflow-hidden">
                                            <div className="px-8 py-6 border-b border-white/5 flex items-center gap-3">
                                                <LucideIcon name="user-circle" size={16} className="text-indigo-500" />
                                                <h2 className="text-[11px] font-black uppercase tracking-[0.3em]">Styling Advisory</h2>
                                            </div>
                                            <div className="p-8 grid grid-cols-1 md:grid-cols-3 gap-8">
                                                <div className="space-y-3">
                                                    <div className="flex items-center gap-2 text-white/40">
                                                        <LucideIcon name="scissors" size={14} />
                                                        <span className="text-[9px] font-bold uppercase tracking-widest">Hair Styles</span>
                                                    </div>
                                                    <p className="text-[11px] leading-relaxed text-white/80">{results.advice.hair}</p>
                                                </div>
                                                <div className="space-y-3">
                                                    <div className="flex items-center gap-2 text-white/40">
                                                        <LucideIcon name="eye" size={14} />
                                                        <span className="text-[9px] font-bold uppercase tracking-widest">Eyewear Specs</span>
                                                    </div>
                                                    <p className="text-[11px] leading-relaxed text-white/80">{results.advice.eyewear}</p>
                                                </div>
                                                <div className="space-y-3">
                                                    <div className="flex items-center gap-2 text-white/40">
                                                        <LucideIcon name="check-circle-2" size={14} />
                                                        <span className="text-[9px] font-bold uppercase tracking-widest">Grooming</span>
                                                    </div>
                                                    <p className="text-[11px] leading-relaxed text-white/80">{results.advice.grooming}</p>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="glass-card p-8 rounded-[2.5rem] border-indigo-500/20 bg-indigo-500/[0.03] flex flex-col sm:flex-row gap-6 items-center">
                                            <div className="w-16 h-16 rounded-full bg-indigo-500/10 flex items-center justify-center shrink-0">
                                                <LucideIcon name="shield-check" size={32} className="text-indigo-400" />
                                            </div>
                                            <div className="text-center sm:text-left space-y-2">
                                                <h4 className="text-[10px] font-black uppercase tracking-[0.4em] text-indigo-400">Ash Vision Verification</h4>
                                                <p className="text-xs text-white/50 leading-relaxed font-light">
                                                    Analysis based on current structural data. Future updates will include 3D depth mapping.
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </main>

                        <footer className="mt-20 py-12 border-t border-white/5 text-center space-y-4">
                            <p className="text-[9px] font-black uppercase tracking-[0.5em] text-white/10">ASH VISION © 2026 | Proprietary Bio-Logic System</p>
                            <p className="text-[12px] font-light tracking-[0.2em] text-white/30 italic">by Hussain</p>
                        </footer>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
