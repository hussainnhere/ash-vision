<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASH VISION | Advanced Analytics</title>
    
    <!-- Load Tailwind and Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Link to the CSS file you created in the src folder -->
    <link rel="stylesheet" href="src/styles.css">
    
    <style>
        body { background-color: #050505; color: white; margin: 0; font-family: sans-serif; }
    </style>
</head>
<body>
    <!-- This is where the app will appear -->
    <div id="root"></div>

    <!-- Essential React & Babel Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- This specific line connects your App.jsx logic -->
    <script type="text/babel" data-type="module" data-presets="react" src="src/App.jsx"></script>

    <script>
        // This ensures icons show up correctly even if the page loads slowly
        window.addEventListener('load', () => {
            setInterval(() => {
                if (window.lucide) window.lucide.createIcons();
            }, 1000);
        });
    </script>
</body>
</html>
