<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASH VISION | Advanced Analytics</title>
    
    <!-- Styling Framework -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Icon Library -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom CSS Link -->
    <link rel="stylesheet" href="src/styles.css">
    
    <style>
        body { background-color: #050505; color: white; margin: 0; }
        #root { min-height: 100vh; }
    </style>
</head>
<body>

    <!-- React App Container -->
    <div id="root"></div>

    <!-- React Core Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel (Compiles JSX in the browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Pointing to your renamed file: src/app.js -->
    <script type="text/babel" data-presets="react" src="src/app.js"></script>

    <script>
        // This ensures icons render correctly after the React app loads
        window.addEventListener('load', function() {
            const iconInterval = setInterval(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, 1000);
            
            // Stop checking after 10 seconds to save battery/performance
            setTimeout(() => clearInterval(iconInterval), 10000);
        });
    </script>
</body>
</html>
